<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarta Receita</title>
</head>

<style>
    /* .cervejas{
        font-family: 'Courier New', Courier, monospace;

        width: 200px;

    .tabelaCervejas tr,th,td{
        border: 1px solid black;
    }
</style>

<body>
    <div id="meu amor"><a href="#" id="linkCarregar">Carregando pratos...</a></div>
    <a href="#" id="linkOrdenar">Ordenar Pratos</a>
    <a href="#" id="linkEmbaralhar">Embaralhar Pratos</a>
</body>

<script>
    let pratos = ["Feijoada", "Moqueca", "Escondidinho"]

    const transformar = item => `<tr><td>${item}</td></tr>`

    const carregarDiv = () => {
        const div = document.getElementById("meu amor")
        const linhas = pratos.map(transformar)
        div.innerHTML = `<table class="tabelaPratos"><tr><th>Pratos</th></tr>${linhas.join("\n")}</table>`
    }

    const ordenarPratos = () => {
        pratos.sort()
        carregarDiv()
    }

    const embaralharPratos = () => {
        pratos.sort(() => Math.random() - 0.5)
        carregarDiv()
    }

    const linkCarregar = document.getElementById("linkCarregar")
    linkCarregar.addEventListener("click", (evento) => {
        evento.preventDefault()
        carregarDiv()
    })

    const linkOrdenar = document.getElementById("linkOrdenar")
    linkOrdenar.addEventListener("click", (evento) => {
        evento.preventDefault()
        ordenarPratos()
    })

    const linkEmbaralhar = document.getElementById("linkEmbaralhar")
    linkEmbaralhar.addEventListener("click", (evento) => {
        evento.preventDefault()
        embaralharPratos()
    })
</script>

</html>
