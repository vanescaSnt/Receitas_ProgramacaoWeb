<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terceira Receita</title>
</head>

<body>
    <div id="divLink"><a href="#" id="linkCarregar">Carregando pratos...</a></div>
    <div id="divPrato"></div>
</body>

<script>
    const carregarDiv = () => {
        const div = document.getElementById("divPrato")

        div.style.opacity = 0

        setTimeout(() => {
            if (div.innerHTML === "") {
                div.innerHTML = `<h1>Feijoada</h1>`
            } else {
                div.innerHTML = ""
            }
            div.style.opacity = 1
        }, 500)
    }

    const link = document.getElementById("linkCarregar")
    link.addEventListener("click", (evento) => {
        evento.preventDefault()
        carregarDiv()
    })
</script>

</html>
